name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
          gitleaks git --config .gitleaks.toml --redact --verbose .

      - uses: supabase/setup-cli@v3
        with:
          version: 2.65.5

      # Local stack only. Migrations reach simonsays-prod through Supabase's GitHub
      # integration on push to main; CI never runs `supabase db push`.
      - name: supabase start
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: supabase db reset
        run: supabase db reset

      # Local stack URL/keys for the DB tests (test/local-supabase.ts). They're the CLI's
      # local demo values, never committed; only the variable names are printed.
      - name: local Supabase env
        run: |
          supabase status -o env \
            | sed -nE 's/^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET)="?([^"]*)"?$/LOCAL_SUPABASE_\1=\2/p' > local.env
          cut -d= -f1 local.env
          test "$(wc -l < local.env)" -eq 4
          cat local.env >> "$GITHUB_ENV"
          rm local.env

      - run: npx tsc --noEmit

      - run: npx vitest run

      # A DB test that failed on the stack itself (e.g. a 502 from the API gateway) is only
      # diagnosable from the gateway and PostgREST logs.
      - name: local Supabase logs
        if: failure()
        run: |
          for c in kong rest auth db; do
            echo "::group::supabase_${c}_simon-says"
            docker logs --tail 300 "supabase_${c}_simon-says" 2>&1 || true
            echo "::endgroup::"
          done

  # End-to-end (docs/testing.md "E2E"): the real app under `next dev` against its own local
  # Supabase (jobs can't share a stack), every external service faked (e2e/fakes).
  # Three shards, each with its own runner, Supabase stack and app. The `e2e` job below is the
  # required check name; it aggregates the shards.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.65.5

      # Auth and storage stay on (sign-in, logos); the e2e run signs in many test users, so the
      # local stack's sign-in rate limits are lifted for this job only.
      - name: supabase start
        run: |
          sed -i -E 's/^(sign_in_sign_ups|token_verifications|token_refresh) = .*/\1 = 10000/' supabase/config.toml
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: supabase db reset
        run: supabase db reset

      - name: local Supabase env
        run: |
          supabase status -o env \
            | sed -nE 's/^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET)="?([^"]*)"?$/LOCAL_SUPABASE_\1=\2/p' > local.env
          cut -d= -f1 local.env
          test "$(wc -l < local.env)" -eq 4
          cat local.env >> "$GITHUB_ENV"
          rm local.env

      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Browsers come from the cache when it hits; the system deps are never cached.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The required check. Passes only when every shard passed (a skipped or cancelled shard fails it).
  e2e:
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "e2e shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
